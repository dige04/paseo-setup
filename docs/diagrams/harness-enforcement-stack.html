<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tầng cưỡng chế — paseo-claude-team</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
  .frame { max-width: 1200px; width: 100%; }
  .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; font-weight: 500;
             letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
  h1 { font-family: 'Instrument Serif', serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
       font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
  svg { width: 100%; min-width: 900px; display: block; }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer stack · Governance control catalog</p>
    <h1>Cái gì máy giữ, cái gì chỉ là luật</h1>

    <svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="stack-title stack-desc">
      <title id="stack-title">Sáu tầng cưỡng chế của paseo-claude-team</title>
      <desc id="stack-desc">Sáu bề mặt cưỡng chế xếp theo thời điểm nổ, từ brief lúc giao việc tới sổ tay tích luỹ sau cùng; tầng hook lúc ghi là tầng chịu lực nhưng chỉ phủ seat claude, phần còn lại rơi xuống tầng phát hiện lúc chạy.</desc>
      <defs>
        <marker id="arrow-dir" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a8399"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- direction indicator, left margin outside the stack -->
      <line x1="112" y1="112" x2="112" y2="480" stroke="#7a8399" stroke-width="1" marker-end="url(#arrow-dir)"/>
      <text x="96" y="300" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em" transform="rotate(-90 96 300)">THỜI ĐIỂM NỔ</text>

      <!-- L1 authoring -->
      <rect x="160" y="104" width="800" height="64" fill="#f5f5f5"/>
      <rect x="160" y="104" width="800" height="64" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="180" y="132" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L1</text>
      <text x="180" y="152" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">GIAO VIỆC</text>
      <text x="320" y="142" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">V3 brief · skill doctrine · outcome-level</text>
      <text x="940" y="130" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">HUMAN + MODEL · LUẬT</text>
      <text x="940" y="150" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">BRIEF HỎNG → PEER TỪ CHỐI LÀM</text>

      <!-- L2 write-time hook — FOCAL -->
      <rect x="160" y="168" width="800" height="64" fill="#f5f5f5"/>
      <rect x="160" y="168" width="800" height="64" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="180" y="196" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L2</text>
      <text x="180" y="216" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">LÚC GHI</text>
      <text x="320" y="206" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">PreToolUse hook · 7 cổng fail-closed</text>
      <text x="940" y="194" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">CODE · GIỮ CẢ DƯỚI BYPASS</text>
      <text x="940" y="214" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">PHỦ: CHỈ SEAT CLAUDE-* ← LỖ HỔNG</text>

      <!-- L3 test -->
      <rect x="160" y="232" width="800" height="64" fill="#f5f5f5"/>
      <rect x="160" y="232" width="800" height="64" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="180" y="260" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L3</text>
      <text x="180" y="280" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">LÚC TEST</text>
      <text x="320" y="270" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">22 file test · mỗi fix kèm killing test</text>
      <text x="940" y="258" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">CODE · 41/41 XANH</text>
      <text x="940" y="278" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">MUTATE → PHẢI ĐỎ, MỚI TÍNH</text>

      <!-- L4 pre-merge -->
      <rect x="160" y="296" width="800" height="64" fill="#f5f5f5"/>
      <rect x="160" y="296" width="800" height="64" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="180" y="324" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L4</text>
      <text x="180" y="344" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">TRƯỚC MERGE</text>
      <text x="320" y="334" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">CI: suite · digest drift · report gate</text>
      <text x="940" y="322" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">PLATFORM · CHẶN PR</text>
      <text x="940" y="342" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">ĐỔI CI.YML CŨNG LÀM ĐỎ DIGEST</text>

      <!-- L5 runtime detection -->
      <rect x="160" y="360" width="800" height="64" fill="#f5f5f5"/>
      <rect x="160" y="360" width="800" height="64" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="180" y="388" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L5</text>
      <text x="180" y="408" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">LÚC CHẠY</text>
      <text x="320" y="398" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Assert A1–A7 · reconciler · exit 3</text>
      <text x="940" y="386" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">CODE · PHÁT HIỆN, KHÔNG NGĂN</text>
      <text x="940" y="406" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">GÁNH PHẦN L2 KHÔNG VỚI TỚI</text>

      <!-- L6 memory -->
      <rect x="160" y="424" width="800" height="64" fill="#f5f5f5"/>
      <rect x="160" y="424" width="800" height="64" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
      <text x="180" y="452" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L6</text>
      <text x="180" y="472" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">SAU CÙNG</text>
      <text x="320" y="462" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Catalog AP-01…04 · watchlist W01–W18</text>
      <text x="940" y="450" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">HUMAN · LUẬT + VẾT EPISODE</text>
      <text x="940" y="470" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">≥2 EPISODE MỚI LÊN MECHANISM</text>

      <!-- aside -->
      <text x="160" y="528" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Chỉ 4/6 tầng là máy giữ. Hai tầng còn lại được ghi rõ là luật — không đội lốt cơ chế.</text>

      <!-- legend -->
      <line x1="160" y1="560" x2="960" y2="560" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="160" y="580" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="256" y="572" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="278" y="580" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">TẦNG CHỊU LỰC</text>
      <text x="440" y="580" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CỘT PHẢI: AI CƯỠNG CHẾ · ĐỘ PHỦ · LỖ HỔNG</text>
      <text x="960" y="580" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">4 CƠ CHẾ · 2 LUẬT</text>
    </svg>
  </div>
</body>
</html>
