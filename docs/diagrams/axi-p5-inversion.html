<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AXI P5 inversion — empty is not clean</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Paired policy traces</p>
    <h1>The one AXI rule the harness runs backwards</h1>

    <svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="axi-inversion-title axi-inversion-desc">
      <title id="axi-inversion-title">AXI principle 5 inverted into a fail-closed rule</title>
      <desc id="axi-inversion-desc">The same empty scan result evaluated under two policies: AXI treats a definitive empty state as a clean exit zero, while the harness treats a scope that matched none of the listed agents as a topology violation with exit code three.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- connectors first -->
      <path d="M476,112 V144 Q476,152 468,152 H268 Q260,152 260,160 V184" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M524,112 V144 Q524,152 532,152 H732 Q740,152 740,160 V184" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <line x1="260" y1="248" x2="260" y2="280" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="740" y1="248" x2="740" y2="280" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="260" y1="344" x2="260" y2="376" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="740" y1="344" x2="740" y2="376" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="260" y1="440" x2="260" y2="512" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="740" y1="440" x2="740" y2="512" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- shared input -->
      <rect x="340" y="56" width="320" height="56" rx="20" fill="#f5f5f5"/>
      <rect x="340" y="56" width="320" height="56" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="500" y="82" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Same input: the scan returns nothing</text>
      <text x="500" y="100" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LISTEDTOTAL 122 · SCOPEDTOTAL 0 · MISTYPED --CWD</text>

      <!-- column headers -->
      <text x="120" y="180" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">AXI P5 AS SPECIFIED</text>
      <text x="600" y="180" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HARNESS A6 AS SHIPPED</text>

      <!-- row 1 -->
      <text x="500" y="224" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">COMMAND COMPLETED?</text>

      <rect x="120" y="184" width="280" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="120" y="184" width="280" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <circle cx="140" cy="206" r="4" fill="#2d3142"/>
      <text x="152" y="210" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">PASS</text>
      <text x="260" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Process returned</text>

      <rect x="600" y="184" width="280" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="184" width="280" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <circle cx="620" cy="206" r="4" fill="#2d3142"/>
      <text x="632" y="210" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">PASS</text>
      <text x="740" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Process returned</text>

      <!-- row 2 -->
      <text x="500" y="320" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESULT SET EMPTY?</text>

      <rect x="120" y="280" width="280" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="120" y="280" width="280" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <circle cx="140" cy="302" r="4" fill="#2d3142"/>
      <text x="152" y="306" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">PASS</text>
      <text x="260" y="332" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Zero items, no error</text>

      <rect x="600" y="280" width="280" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="280" width="280" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <circle cx="620" cy="302" r="4" fill="#2d3142"/>
      <text x="632" y="306" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">PASS</text>
      <text x="740" y="332" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Zero items, no error</text>

      <!-- row 3 — divergence -->
      <text x="500" y="404" fill="#eb6c36" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">FIRST DIVERGENCE</text>
      <text x="500" y="424" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">IS EMPTY THE ANSWER?</text>

      <rect x="120" y="376" width="280" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="120" y="376" width="280" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <circle cx="140" cy="398" r="4" fill="#2d3142"/>
      <text x="152" y="402" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">PASS</text>
      <text x="260" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Empty is a definitive state</text>

      <rect x="600" y="376" width="280" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="376" width="280" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <circle cx="620" cy="398" r="4" fill="none" stroke="#2d3142" stroke-width="1.2"/>
      <text x="632" y="402" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">FAIL</text>
      <text x="740" y="428" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Matched 0 of 122 listed</text>

      <!-- outcomes -->
      <rect x="120" y="512" width="280" height="56" rx="20" fill="#f5f5f5"/>
      <rect x="120" y="512" width="280" height="56" rx="20" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="260" y="538" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reported clean</text>
      <text x="260" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXIT 0 · GATE PASSES</text>

      <rect x="600" y="512" width="280" height="56" rx="20" fill="#f5f5f5"/>
      <rect x="600" y="512" width="280" height="56" rx="20" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="740" y="538" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Topology violation</text>
      <text x="740" y="556" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EXIT 3 · FIX BEFORE DISPATCH</text>

      <!-- editorial aside -->
      <text x="500" y="596" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">a scan of nothing must never read as a pass</text>

      <!-- legend -->
      <line x1="80" y1="624" x2="920" y2="624" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="80" y="644" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <circle cx="176" cy="640" r="4" fill="#2d3142"/>
      <text x="188" y="644" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RULE PASSED</text>
      <circle cx="336" cy="640" r="4" fill="none" stroke="#2d3142" stroke-width="1.2"/>
      <text x="348" y="644" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RULE FAILED</text>
      <line x1="496" y1="640" x2="528" y2="640" stroke="#eb6c36" stroke-width="1"/>
      <text x="540" y="644" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">DIVERGENCE</text>
      <text x="920" y="644" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">SAME INPUT · TWO POLICIES</text>
    </svg>
  </div>
</body>
</html>
