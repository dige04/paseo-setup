<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cổng hội tụ — khi nào được phép sửa</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
  .frame { max-width: 1200px; width: 100%; }
  .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; font-weight: 500;
             letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
  h1 { font-family: 'Instrument Serif', serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
       font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
  svg { width: 100%; min-width: 900px; display: block; }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>Một finding phải qua ba cửa mới được sửa</h1>

    <svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gate-title gate-desc">
      <title id="gate-title">Cổng hội tụ quyết định finding nào được phép sửa</title>
      <desc id="gate-desc">Mỗi phát hiện từ vòng review phải tái lập được trên bytes hiện tại, phải có đủ đường hội tụ độc lập hoặc là lỗi phá hợp đồng, và phải nêu rõ đánh đổi của việc sửa ngay; thiếu bất kỳ điều kiện nào thì chỉ được ghi nhận chứ không được sửa.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- yes-path connectors -->
      <line x1="400" y1="104" x2="400" y2="128" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="400" y1="224" x2="400" y2="260" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="400" y1="356" x2="400" y2="392" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="400" y1="488" x2="400" y2="528" stroke="#eb6c36" stroke-width="1" marker-end="url(#arrow-accent)"/>

      <!-- no-path connectors to the record-only outcome -->
      <path d="M540,180 H612 Q620,180 620,188 V280 Q620,288 628,288 H672" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="540" y1="312" x2="672" y2="312" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M540,444 H612 Q620,444 620,436 V336 Q620,328 628,328 H672" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- branch labels -->
      <rect x="548" y="158" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560" y="167" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
      <rect x="548" y="290" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560" y="299" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
      <rect x="548" y="422" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560" y="431" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
      <rect x="412" y="232" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="426" y="241" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">YES</text>
      <rect x="412" y="364" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="426" y="373" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">YES</text>
      <rect x="412" y="496" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="426" y="505" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">YES</text>

      <!-- start -->
      <rect x="280" y="48" width="240" height="56" rx="20" fill="#f5f5f5"/>
      <rect x="280" y="48" width="240" height="56" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="400" y="74" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Finding từ vòng review</text>
      <text x="400" y="92" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GIỮ MỌI ỨNG VIÊN · KHÔNG LỌC SỚM</text>

      <!-- decision A -->
      <polygon points="400,128 540,180 400,232 260,180" fill="#f5f5f5"/>
      <polygon points="400,128 540,180 400,232 260,180" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tái lập được?</text>
      <text x="400" y="194" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRÊN BYTES HIỆN TẠI</text>

      <!-- decision B -->
      <polygon points="400,260 540,312 400,364 260,312" fill="#f5f5f5"/>
      <polygon points="400,260 540,312 400,364 260,312" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hội tụ ≥3 đường?</text>
      <text x="400" y="326" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HOẶC PHÁ HỢP ĐỒNG</text>

      <!-- decision C -->
      <polygon points="400,392 540,444 400,496 260,444" fill="#f5f5f5"/>
      <polygon points="400,392 540,444 400,496 260,444" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="400" y="440" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Đã nêu đánh đổi?</text>
      <text x="400" y="458" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">“KHÔNG CÓ” CŨNG PHẢI VIẾT RA</text>

      <!-- outcome: fix-eligible -->
      <rect x="280" y="528" width="240" height="56" rx="20" fill="#f5f5f5"/>
      <rect x="280" y="528" width="240" height="56" rx="20" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="400" y="554" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Được phép sửa</text>
      <text x="400" y="572" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FIX-ELIGIBLE · KÈM KILLING TEST</text>

      <!-- outcome: record-only -->
      <rect x="680" y="272" width="240" height="56" rx="20" fill="#f5f5f5"/>
      <rect x="680" y="272" width="240" height="56" rx="20" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="800" y="298" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chỉ ghi nhận</text>
      <text x="800" y="316" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">KHÔNG PHẢI BỊ BÁC — CHỜ VÒNG SAU</text>

      <!-- asides -->
      <text x="500" y="620" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">Sửa là đã commit, khó lùi. Ghi nhận thì lúc nào sửa cũng được — nên nghiêng về ghi nhận.</text>
      <text x="500" y="644" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">Và nếu ≥2 finding chung một cơ chế: dừng, hỏi architect về gốc trước khi sửa bất kỳ cái nào.</text>

      <!-- legend -->
      <line x1="80" y1="664" x2="920" y2="664" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="80" y="676" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="176" y1="672" x2="208" y2="672" stroke="#eb6c36" stroke-width="1"/>
      <text x="220" y="676" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ĐƯỜNG DUY NHẤT ĐƯỢC SỬA</text>
      <text x="920" y="676" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">3 CỬA · 2 KẾT CỤC</text>
    </svg>
  </div>
</body>
</html>
