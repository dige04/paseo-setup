<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topology & authority — paseo-claude-team</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Geist', system-ui, sans-serif; background: #f5f5f5; color: #2d3142;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
  .frame { max-width: 1200px; width: 100%; }
  .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; font-weight: 500;
             letter-spacing: 0.18em; text-transform: uppercase; color: #4f5d75; margin-bottom: 0.5rem; }
  h1 { font-family: 'Instrument Serif', serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
       font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
  svg { width: 100%; min-width: 900px; display: block; }
</style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Org chart · Diagram Design</p>
    <h1>Ai được làm gì — và chỗ nào có máy giữ</h1>

    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="topo-title topo-desc">
      <title id="topo-title">Topology và authority của paseo-claude-team</title>
      <desc id="topo-desc">Human sở hữu merge và deploy, Supervisor chỉ quan sát, Lead là seat duy nhất điều phối và không tự viết product code, bốn loại Peer nhận quyền từ V3 brief; seat claude được hook cưỡng chế còn fleet omp chỉ ràng bằng prompt và session mode.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a8399"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- connectors -->
      <path d="M488,104 V136 Q488,144 480,144 H228 Q220,144 220,152 V176" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M512,104 V136 Q512,144 520,144 H652 Q660,144 660,152 V176" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <line x1="320" y1="208" x2="552" y2="208" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <rect x="368" y="182" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="436" y="191" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OBSERVES · NO AUTHORITY</text>

      <line x1="660" y1="240" x2="660" y2="284" stroke="#4f5d75" stroke-width="1"/>
      <line x1="194" y1="284" x2="806" y2="284" stroke="#4f5d75" stroke-width="1"/>
      <line x1="194" y1="284" x2="194" y2="320" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="398" y1="284" x2="398" y2="320" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="602" y1="284" x2="602" y2="320" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="806" y1="284" x2="806" y2="320" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Human -->
      <rect x="420" y="48" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="420" y="48" width="160" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="500" y="74" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Human · chủ sở hữu</text>
      <text x="500" y="92" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MERGE · DEPLOY · POLICY</text>

      <!-- Supervisor -->
      <rect x="120" y="176" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="120" y="176" width="200" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="220" y="202" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Supervisor</text>
      <text x="220" y="220" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OBSERVE-ONLY · MUTATES:FALSE</text>
      <text x="220" y="234" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ĐỀ XUẤT, KHÔNG QUYẾT</text>

      <!-- Lead (focal) -->
      <rect x="560" y="176" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="176" width="200" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="660" y="202" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lead</text>
      <text x="660" y="220" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SEAT DUY NHẤT ĐIỀU PHỐI</text>
      <text x="660" y="234" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NGHIỆM THU, KHÔNG TỰ VIẾT</text>

      <!-- Peers -->
      <rect x="104" y="320" width="180" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="104" y="320" width="180" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="194" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Architect-Peer</text>
      <text x="194" y="366" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ-ONLY</text>
      <text x="194" y="382" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PHÁN GỐC · ĐƯỢC PHẢN BIỆN LEAD</text>

      <rect x="308" y="320" width="180" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="308" y="320" width="180" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="398" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Engineer-Peer</text>
      <text x="398" y="366" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WRITE · MỘT SCOPE</text>
      <text x="398" y="382" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FIX KÈM KILLING TEST</text>

      <rect x="512" y="320" width="180" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="512" y="320" width="180" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="602" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reviewer-Peer</text>
      <text x="602" y="366" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ-ONLY</text>
      <text x="602" y="382" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHẶN NGHIỆM THU</text>

      <rect x="716" y="320" width="180" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="716" y="320" width="180" height="72" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="806" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Scout fleet · omp</text>
      <text x="806" y="366" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROMPT + MODE ONLY</text>
      <text x="806" y="382" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HOOK KHÔNG VỚI TỚI</text>

      <!-- footer callouts -->
      <text x="500" y="436" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">Quyền đọc từ V3 brief của lượt hiện tại — brief lượt trước không cấp gì cho lượt này.</text>
      <text x="500" y="464" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">Seat nào hook không với tới thì tầng phát hiện gánh — chưa bao giờ là “không ai canh”.</text>

      <!-- legend -->
      <line x1="80" y1="520" x2="920" y2="520" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="80" y="540" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="176" y="532" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="198" y="540" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FRONT DOOR</text>
      <rect x="336" y="532" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="358" y="540" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HOOK CƯỠNG CHẾ</text>
      <rect x="520" y="532" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="542" y="540" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CHỈ PROMPT — CÓ LỖ HỔNG</text>
      <text x="920" y="540" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">3 VAI · 4 LOẠI PEER</text>
    </svg>
  </div>
</body>
</html>
