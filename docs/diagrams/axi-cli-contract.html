<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AXI CLI contract — one invocation</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>One invocation, three exit codes: the AXI-shaped tool contract</h1>

    <svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="axi-contract-title axi-contract-desc">
      <title id="axi-contract-title">AXI-shaped CLI contract for governance-graph --assert</title>
      <desc id="axi-contract-desc">An agent invokes the governance-graph assert command, which validates its own arguments before any work, queries the Paseo daemon with a fixed number of calls, computes aggregates with truncation signalled, and returns either a clean envelope with exit code zero or a violation envelope with exit code three.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- lifelines -->
      <line x1="180" y1="108" x2="180" y2="668" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="500" y1="108" x2="500" y2="668" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="840" y1="108" x2="840" y2="668" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- activation bars -->
      <rect x="496" y="160" width="8" height="464" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="836" y="264" width="8" height="40" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="836" y="344" width="8" height="40" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- messages -->
      <line x1="188" y1="160" x2="488" y2="160" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="264" y="140" width="152" height="12" rx="2" fill="#f5f5f5"/>
      <text x="340" y="149" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">--ASSERT --CWD SCOPE</text>

      <path d="M508,200 H556 Q564,200 564,208 V216 Q564,224 556,224 H508" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="576" y="208" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Validate argv first</text>
      <text x="576" y="224" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">UNKNOWN FLAG → EXIT 2 · {OK:FALSE, CODE}</text>

      <line x1="508" y1="264" x2="828" y2="264" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
      <rect x="608" y="244" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="668" y="253" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PASEO LS -G --JSON</text>

      <line x1="828" y1="304" x2="508" y2="304" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="616" y="284" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="668" y="293" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">122 LISTED AGENTS</text>

      <line x1="508" y1="344" x2="828" y2="344" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
      <rect x="600" y="324" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="668" y="333" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LS --LABEL ROLE · 3 FIXED</text>

      <line x1="828" y1="384" x2="508" y2="384" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="608" y="364" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="668" y="373" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MEMBERSHIP OR ERROR</text>

      <path d="M508,424 H556 Q564,424 564,432 V440 Q564,448 556,448 H508" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="576" y="432" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">Aggregate before reply</text>
      <text x="576" y="448" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">META.SCAN · DETAIL SLICED @20 + COUNT</text>

      <!-- alt fragment -->
      <rect x="168" y="488" width="344" height="152" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="168" y="488" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="188" y="500" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>

      <text x="180" y="520" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[no violations]</text>
      <line x1="488" y1="552" x2="192" y2="552" stroke="#eb6c36" stroke-width="1" marker-end="url(#arrow-accent)"/>
      <rect x="272" y="532" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="340" y="541" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AGGREGATES · EXIT 0</text>

      <line x1="176" y1="576" x2="504" y2="576" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>

      <text x="180" y="600" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[violations found]</text>
      <line x1="488" y1="624" x2="192" y2="624" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="256" y="604" width="168" height="12" rx="2" fill="#f5f5f5"/>
      <text x="340" y="613" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VIOLATIONS + EVIDENCE · EXIT 3</text>

      <!-- actors (drawn after arrows) -->
      <rect x="100" y="60" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="100" y="60" width="160" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="180" y="82" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lead agent</text>
      <text x="180" y="98" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">MORNING GATE</text>

      <rect x="420" y="60" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="420" y="60" width="160" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="500" y="82" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">governance-graph</text>
      <text x="500" y="98" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">--ASSERT</text>

      <rect x="760" y="60" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="60" width="160" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="840" y="82" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Paseo daemon</text>
      <text x="840" y="98" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">LOCAL · READ-ONLY</text>

      <!-- legend -->
      <line x1="80" y1="700" x2="920" y2="700" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="80" y="720" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="180" y1="716" x2="212" y2="716" stroke="#eb6c36" stroke-width="1"/>
      <text x="224" y="720" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HAPPY PATH</text>
      <line x1="352" y1="716" x2="384" y2="716" stroke="#2e5aa8" stroke-width="1"/>
      <text x="396" y="720" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">DAEMON CALL</text>
      <line x1="528" y1="716" x2="560" y2="716" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="572" y="720" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RETURN</text>
      <text x="920" y="720" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">EXIT 0 · 2 · 3</text>
    </svg>
  </div>
</body>
</html>
